<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋糕生產計畫 (Cake Production PWA)</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b6b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CakePlan">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b6b;
            --secondary: #feca57;
            --bg: #1e272e;
            --surface: rgba(255, 255, 255, 0.1);
            --surface-hover: rgba(255, 255, 255, 0.15);
            --text-main: #f5f6fa;
            --text-muted: #dcdde1;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #2f3640 0%, #1e272e 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }

        .glass-container {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 { font-size: 28px; }
        h2 { font-size: 20px; margin-top: 10px; }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        /* Flavor Cards */
        .flavor-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .flavor-card h3 {
            color: var(--secondary);
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input, select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        select option {
            color: black;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.success-btn {
            background: linear-gradient(45deg, var(--success), #20bf6b);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .result-card {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            opacity: 0;
            display: none;
        }

        .result-card.active {
            opacity: 1;
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .plan-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            font-size: 16px;
        }
        .plan-item:last-child {
            border-bottom: none;
        }

        .total-batches {
            font-size: 24px;
            color: var(--primary);
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }

        /* History Table Styles */
        .history-wrapper {
            overflow-x: auto;
            margin-top: 15px;
            width: 100%;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .history-table th, .history-table td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .history-table th {
            background: rgba(0,0,0,0.4);
            color: var(--secondary);
            font-weight: bold;
        }
        .history-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .flavor-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            font-size: 12px;
            white-space: nowrap;
        }

        /* Mobile Adjustments */
        @media (max-width: 500px) {
            body {
                padding: 10px;
            }
            .glass-container {
                padding: 20px 15px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .tab {
                font-size: 12px;
                padding: 8px 2px;
            }
            h1 {
                font-size: 24px;
            }
            h2 {
                font-size: 18px;
            }
            .input-group label {
                font-size: 13px;
                white-space: normal;
                word-wrap: break-word;
            }
            .glass-container input, .glass-container select {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>🍰 每日蛋糕生產計畫</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('plan-tab')">📅 規劃預估 (Plan)</div>
            <div class="tab" onclick="switchTab('record-tab')">📝 打烊紀錄 (Record)</div>
            <div class="tab" onclick="switchTab('history-tab')">📖 歷史總覽 (History)</div>
            <div class="tab" onclick="switchTab('trend-tab')">📈 趨勢圖表 (Trends)</div>
        </div>

        <!-- 規劃預估 (Plan) 標籤頁 -->
        <div id="plan-tab" class="tab-content active">
            <h2>計算未來產量</h2>
            
            <div class="input-group">
                <label>選擇計畫日期:</label>
                <input type="date" id="plan-date" onchange="updatePlanFlavors()">
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>預計需求增減 (Demand %):</label>
                    <select id="holiday-multiplier">
                        <option value="0.5">大幅減少 (50%)</option>
                        <option value="0.7">中幅減少 (70%)</option>
                        <option value="0.9">小幅減少 (90%)</option>
                        <option value="1.0" selected>平常日 (100%)</option>
                        <option value="1.1">小幅增加 (110%)</option>
                        <option value="1.2">中幅增加 (120%)</option>
                        <option value="1.5">節日大增 (150%)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>當天新人數量 (New Joiners):</label>
                    <input type="number" id="new-joiners" value="0" min="0" max="10">
                </div>
            </div>

            <button onclick="calculatePlan()">計算建議產量</button>

            <div class="result-card" id="plan-result">
                <h3 style="color:var(--secondary); text-align:center; margin-bottom: 15px;">📊 建議生產分配</h3>
                <div id="plan-list"></div>
                <div class="total-batches" id="plan-total"></div>
                <div style="text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 5px;">(每種口味依各自模具數獨立計算批次進位：原味18、巧克力12、其他14)</div>
            </div>
        </div>

        <!-- 今日打烊紀錄 (Record) 標籤頁 -->
        <div id="record-tab" class="tab-content">
            <h2>儲存或修改打烊數據</h2>
            
            <div class="input-group">
                <label>選擇紀錄日期 (可回溯過往日期):</label>
                <input type="date" id="record-date" onchange="loadRecordForDate()">
            </div>
            
            <div id="date-info" style="text-align: center; margin-bottom: 10px; color: var(--text-muted); font-size: 14px;"></div>
            
            <div class="input-group" style="align-items: center; flex-direction: row; justify-content: flex-start; gap: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 5px; flex: 1; min-width: 250px;">
                    <input type="checkbox" id="record-is-holiday" style="width:24px; height:24px; flex-shrink: 0;">
                    <label for="record-is-holiday" style="margin:0; font-size:14px; word-wrap: break-word;">標記此日為假日 (Holiday) - 將不納入平常期平均</label>
                </div>
                <div style="display: flex; align-items: center; gap: 5px; min-width: 140px; margin-top: 5px;">
                    <label for="record-joiners" style="margin:0; font-size:14px; white-space: nowrap;">新人數 (Joiners):</label>
                    <input type="number" id="record-joiners" value="0" min="0" max="10" style="width: 50px; padding: 5px; border-radius: 5px;">
                </div>
            </div>

            <!-- 視覺輔助輸入區塊 -->
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-top: 15px; text-align: center;">
                <label for="camera-input" style="display:inline-block; font-size:14px; padding:10px 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; margin: 0;">
                    📸 拍攝 / 上傳紙本報表對照
                </label>
                <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
                <div id="preview-container" style="display: none; margin-top: 15px; text-align: center;">
                    <img id="preview-img" style="max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);">
                    <div style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
                        <button onclick="clearPreview()" style="background: rgba(255,255,255,0.1); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.2); font-size: 14px; cursor: pointer; width: auto; padding: 8px 15px; border-radius: 6px;">❌ 移除照片</button>
                        <button id="btn-auto-import" onclick="autoImportImage()" style="background: linear-gradient(45deg, #a29bfe, #6c5ce7); color: white; border: none; font-size: 14px; cursor: pointer; width: auto; padding: 8px 15px; border-radius: 6px; box-shadow: 0 2px 10px rgba(108, 92, 231, 0.4);">✨ Auto-Import (Claude AI)</button>
                    </div>
                    <div id="ai-loading" style="display: none; margin-top: 10px; color: var(--secondary); font-size: 13px;">
                        ⏳ Claude AI 正在讀取並解析手寫數字，請稍候... / Reading handwritten numbers...
                    </div>
                </div>
            </div>

            <div id="record-flavors-container" style="margin-top: 15px;">
                <!-- Javascript將動態產生今日口味卡片 -->
            </div>

            <button class="success-btn" onclick="saveRecord()">儲存紀錄至系統</button>
        </div>

        <!-- 歷史紀錄 (History) 標籤頁 -->
        <div id="history-tab" class="tab-content">
            <h2>打烊歷史總覽</h2>
            <p style="text-align:center; font-size:14px; color:var(--text-muted);">列出您曾儲存過的所有生產與剩餘數據</p>
            
            <div style="text-align: center; margin-bottom: 10px;">
                <button onclick="injectSampleData()" style="font-size:14px; padding:8px 15px; width: auto; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);">📥 載入 3-4月 真實報表數據</button>
            </div>
            
            <div class="history-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>口味</th>
                            <th>新人</th>
                            <th>製造</th>
                            <th>5pm剩</th>
                            <th>打烊剩</th>
                            <th>完售期</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <!-- Javascript injecting rows here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 趨勢圖表 (Trends) 標籤頁 -->
        <div id="trend-tab" class="tab-content">
            <h2>產能與耗損趨勢</h2>
            <p style="text-align:center; font-size:14px; color:var(--text-muted); margin-bottom: 15px;">顯示最近 14 天的數據變化</p>
            
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <canvas id="demandChart" height="250"></canvas>
            </div>
            
            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;">
                <canvas id="wasteChart" height="250"></canvas>
            </div>
        </div>

    </div>

    <div class="toast" id="toast">✅ 儲存成功！</div>

    <script>
        const FLAVOR_NAMES = {
            original: '原味 (Original)',
            seasonal: '時令 (Seasonal)',
            matcha: '抹茶 (Matcha)',
            chocolate: '巧克力 (Chocolate)'
        };

        // 從 localStorage 讀取紀錄與 API Key
        let cakeHistory = JSON.parse(localStorage.getItem('cakeHistory')) || [];

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'history-tab') {
                renderHistoryTable();
            } else if (tabId === 'trend-tab') {
                renderCharts();
            }
        }

        function getActiveFlavors(weekday) {
            let active = ['original', 'seasonal'];
            if (weekday === 1 || weekday === 3) active.push('matcha');     // Mon/Wed
            if (weekday === 2 || weekday === 4) active.push('chocolate');  // Tue/Thu
            return active;
        }

        function getBatchSize(flavor) {
            if (flavor === 'original') return 18;
            if (flavor === 'chocolate') return 12;
            return 14;
        }

        // ========================
        // Record Tab Logic
        // ========================
        function initRecordTab() {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000; 
            const dateStr = (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
            document.getElementById('record-date').value = dateStr;
            loadRecordForDate();
        }

        function loadRecordForDate() {
            const dateStr = document.getElementById('record-date').value;
            if (!dateStr) return;

            const parts = dateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const weekday = targetDate.getDay();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            document.getElementById('date-info').innerText = `${dateStr} (${days[weekday]})`;
            
            const existingRecord = cakeHistory.find(r => r.date === dateStr);
            if (existingRecord) {
                document.getElementById('record-is-holiday').checked = existingRecord.isHoliday;
                document.getElementById('record-joiners').value = existingRecord.joiners || 0;
            } else {
                document.getElementById('record-is-holiday').checked = false;
                document.getElementById('record-joiners').value = 0;
            }

            const activeFlavors = getActiveFlavors(weekday);
            const container = document.getElementById('record-flavors-container');
            container.innerHTML = '';

            activeFlavors.forEach(flavor => {
                let existingF = null;
                if (existingRecord && existingRecord.flavors && existingRecord.flavors[flavor]) {
                    existingF = existingRecord.flavors[flavor];
                }

                container.innerHTML += `
                    <div class="flavor-card" id="card-${flavor}">
                        <h3>🍰 ${FLAVOR_NAMES[flavor]}</h3>
                        <div class="grid-2">
                            <div class="input-group">
                                <label>生產總數 (Created):</label>
                                <input type="number" id="${flavor}-created" value="${existingF ? existingF.created : 0}" min="0">
                            </div>
                            <div class="input-group">
                                <label>5pm 剩餘 (Rem @ 5pm):</label>
                                <input type="number" id="${flavor}-rem5" value="${existingF ? existingF.rem5pm : 0}" min="0">
                            </div>
                            <div class="input-group">
                                <label>打烊剩餘 (Rem @ Close):</label>
                                <input type="number" id="${flavor}-remClose" value="${existingF ? existingF.remClose : 0}" min="0">
                            </div>
                            <div class="input-group">
                                <label>完售時間 (Sold Out Time):</label>
                                <input type="time" id="${flavor}-soldOut" value="${existingF && existingF.soldOutTime ? existingF.soldOutTime : ''}">
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function saveRecord() {
            const dateStr = document.getElementById('record-date').value;
            if (!dateStr) return alert("請選擇日期");
            
            const parts = dateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const weekday = targetDate.getDay();
            const isHoliday = document.getElementById('record-is-holiday').checked;
            
            const activeFlavors = getActiveFlavors(weekday);
            let flavorsData = {};

            activeFlavors.forEach(flavor => {
                flavorsData[flavor] = {
                    created: parseInt(document.getElementById(`${flavor}-created`).value || 0),
                    rem5pm: parseInt(document.getElementById(`${flavor}-rem5`).value || 0),
                    remClose: parseInt(document.getElementById(`${flavor}-remClose`).value || 0),
                    soldOutTime: document.getElementById(`${flavor}-soldOut`).value
                };
            });

            const record = {
                date: dateStr,
                weekday: weekday,
                isHoliday: isHoliday,
                joiners: parseInt(document.getElementById('record-joiners').value || 0),
                flavors: flavorsData
            };

            // 覆蓋當天既有紀錄
            cakeHistory = cakeHistory.filter(r => r.date !== dateStr);
            cakeHistory.push(record);
            
            // 排序 (日期新到舊)
            cakeHistory.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            localStorage.setItem('cakeHistory', JSON.stringify(cakeHistory));

            showToast();
        }

        // ========================
        // History Tab Logic
        // ========================
        function renderHistoryTable() {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '';
            
            if (cakeHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">尚無任何歷史紀錄，請至「打烊紀錄」分頁建立。</td></tr>`;
                return;
            }

            const days = ['日', '一', '二', '三', '四', '五', '六'];

            cakeHistory.forEach(record => {
                const isHol = record.isHoliday ? '<br><span style="color:var(--primary); font-size:12px;">(假日)</span>' : '';
                const dateLabel = `${record.date}<br>(${days[record.weekday]})${isHol}`;
                const flavors = Object.keys(record.flavors);
                
                flavors.forEach((flavor, index) => {
                    const fData = record.flavors[flavor];
                    
                    // Show date and joiners only on first row of the date group
                    let tdDate = '';
                    let tdJoiner = '';
                    if (index === 0) {
                        tdDate = `<td rowspan="${flavors.length}" style="border-right: 1px solid rgba(255,255,255,0.1); border-bottom: 2px solid rgba(255,255,255,0.3); vertical-align: middle;">${dateLabel}</td>`;
                        tdJoiner = `<td rowspan="${flavors.length}" style="border-bottom: 2px solid rgba(255,255,255,0.3); vertical-align: middle;">${record.joiners || 0}</td>`;
                    }
                    
                    let trStyle = index === flavors.length - 1 ? 'border-bottom: 2px solid rgba(255,255,255,0.3);' : '';

                    tbody.innerHTML += `
                        <tr style="${trStyle}">
                            ${tdDate}
                            <td><span class="flavor-badge">${FLAVOR_NAMES[flavor].split(' ')[0]}</span></td>
                            ${tdJoiner}
                            <td>${fData.created}</td>
                            <td>${fData.rem5pm}</td>
                            <td>${fData.remClose}</td>
                            <td>${fData.soldOutTime || '-'}</td>
                        </tr>
                    `;
                });
            });

        function initPlanTab() {
            const today = new Date();
            const tzoffset = today.getTimezoneOffset() * 60000; 
            const localISOTime = new Date(today - tzoffset).toISOString().slice(0, 10);

        function estimateDemand(created, remClose, soldOutTime, hadJoiners) {
            if (soldOutTime && soldOutTime.trim() !== '') {
                if (hadJoiners) {
                    // Capacity constraint detected! Ignore stockout multiplier.
                    return created;
                }
                
                // Parse soldOutTime -> hour
                const timeStr = soldOutTime.toLowerCase().replace(/\s/g, '');
                let hour = 21; // Default to 21 (9 PM) if parsing fails
                
                const match = timeStr.match(/(\d+)/);
                if (match) {
                    hour = parseInt(match[1]);
                    if (timeStr.includes('pm') && hour < 12) {
                        hour += 12;
                    } else if (!timeStr.includes('am') && hour < 10) {
                        // Standard bakery hours heuristic for single digits
                        hour += 12; 
                    }
                }
                
                // Tiered multiplier
                if (hour <= 16) return created * 1.30;
                if (hour <= 18) return created * 1.15;
                if (hour <= 20) return created * 1.05;
                return created * 1.0;
            }
            return Math.max(0, created - remClose);
        }

        function getFlavorAverage(targetWeekday, flavor, excludeDateStr = null) {
            let targetData = cakeHistory.filter(d => 
                d.weekday === targetWeekday && 
                !d.isHoliday && 
                d.flavors && 
                d.flavors[flavor] &&
                d.date !== excludeDateStr
            );

            // 若該星期幾的所有紀錄都被標記為「假日」而被過濾掉（例如六日全被標為假日）
            // 則啟動防呆機制：忽略假日標籤，直接抓取該星期幾的所有歷史資料作為基準。
            if (targetData.length === 0) {
                targetData = cakeHistory.filter(d => 
                    d.weekday === targetWeekday && 
                    d.flavors && 
                    d.flavors[flavor]
                );
            }

            // data is ordered Newest to Oldest (index 0 is newest)
            const recentThree = targetData.slice(0, 3);
            
            if (recentThree.length === 0) return 9; // 真的一筆都沒有才預設 9 顆

            let totalWeightedDemand = 0;
            
            if (recentThree.length === 3) {
                // index 0 (newest): 50%, index 1: 30%, index 2 (oldest): 20%
                const weights = [0.5, 0.3, 0.2];
                recentThree.forEach((record, index) => {
                    const fData = record.flavors[flavor];
                    const demand = estimateDemand(fData.created, fData.remClose, fData.soldOutTime, record.joiners > 0);
                    totalWeightedDemand += demand * weights[index];
                });
                return totalWeightedDemand;
            } else if (recentThree.length === 2) {
                const weights = [0.6, 0.4];
                recentThree.forEach((record, index) => {
                    const fData = record.flavors[flavor];
                    const demand = estimateDemand(fData.created, fData.remClose, fData.soldOutTime, record.joiners > 0);
                    totalWeightedDemand += demand * weights[index];
                });
                return totalWeightedDemand;
            } else {
                const fData = recentThree[0].flavors[flavor];
                return estimateDemand(fData.created, fData.remClose, fData.soldOutTime, recentThree[0].joiners > 0);
            }
        }

        // Returns {low, median, high, wasteRate, count} for a flavor on a given weekday
        function getFlavorStats(targetWeekday, flavor) {
            let records = cakeHistory.filter(d =>
                d.weekday === targetWeekday &&
                !d.isHoliday &&
                d.flavors && d.flavors[flavor]
            );
            if (records.length === 0) {
                records = cakeHistory.filter(d =>
                    d.weekday === targetWeekday &&
                    d.flavors && d.flavors[flavor]
                );
            }
            if (records.length === 0) return { low: 0, median: 0, high: 0, wasteRate: 0, count: 0 };

            const demands = records.map(r => {
                const f = r.flavors[flavor];
                return estimateDemand(f.created, f.remClose, f.soldOutTime, r.joiners > 0);
            }).sort((a, b) => a - b);

            const wasteRates = records
                .map(r => {
                    const f = r.flavors[flavor];
                    return f.created > 0 ? f.remClose / f.created : 0;
                });
            const avgWasteRate = wasteRates.reduce((a, b) => a + b, 0) / wasteRates.length;

            const mid = Math.floor(demands.length / 2);
            const median = demands.length % 2 !== 0
                ? demands[mid]
                : (demands[mid - 1] + demands[mid]) / 2;

            return {
                low: Math.round(demands[0]),
                median: Math.round(median),
                high: Math.round(demands[demands.length - 1]),
                wasteRate: avgWasteRate,
                count: records.length
            };
        }

        function getWeeklyTrendFactor(targetDateStr) {
            const parts = targetDateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const targetWeekday = targetDate.getDay();
            
            // 決定要往前看幾天：
            // 星期一(1)、星期二(2)、星期三(3) 往前看 2 天
            // 其他天(Thu, Fri, Sat, Sun) 從本週一開始算到前一天
            let lookbackDays = 0;
            if (targetWeekday === 1 || targetWeekday === 2 || targetWeekday === 3) {
                lookbackDays = 2;
            } else {
                lookbackDays = targetWeekday === 0 ? 6 : targetWeekday - 1;
            }
            
            let totalActual = 0;
            let totalHistorical = 0;
            
            // 往前追溯指定的天數
            for (let i = lookbackDays; i > 0; i--) {
                const d = new Date(targetDate);
                d.setDate(d.getDate() - i);
                const dStr = d.getFullYear() + '-' + 
                    String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                    String(d.getDate()).padStart(2, '0');
                    
                const weekday = d.getDay();
                const record = cakeHistory.find(r => r.date === dStr);
                
                // 跳過沒資料或是假日的日期，因為假日會干擾常態趨勢
                if (!record || record.isHoliday) continue; 
                
                const activeFlavors = getActiveFlavors(weekday);
                activeFlavors.forEach(flavor => {
                    if (record.flavors && record.flavors[flavor]) {
                        const fData = record.flavors[flavor];
                        const actualDemand = estimateDemand(fData.created, fData.remClose, fData.soldOutTime, record.joiners > 0);
                        
                        // 計算該日的歷史平均時，必須排除該日當天，否則會把自己算進平均裡
                        const historicalAvg = getFlavorAverage(weekday, flavor, dStr);
                        
                        totalActual += actualDemand;
                        totalHistorical += historicalAvg;
                    }
                });
            }
            
            if (totalHistorical === 0) return 1.0;
            
            let trendMultiplier = totalActual / totalHistorical;
            // 限制趨勢係數在 0.5 到 1.5 之間，避免極端值導致預測失真
            return Math.max(0.5, Math.min(1.5, trendMultiplier));
        }

        function calculatePlan() {
            const dateStr = document.getElementById('plan-date').value;
            if (!dateStr) return alert("請選擇日期");
            
            const parts = dateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const targetWeekday = targetDate.getDay();
            
            const activeFlavors = getActiveFlavors(targetWeekday);
            
            const holidayMultiplier = parseFloat(document.getElementById('holiday-multiplier').value);
            const joiners = parseInt(document.getElementById('new-joiners').value || 0);

            let joinerMultiplier = 1.0;
            if (joiners > 0) {
                joinerMultiplier = 0.90 - (0.05 * (joiners - 1));
                joinerMultiplier = Math.max(0, joinerMultiplier);
            }

            // Find previous day's record for carryover calculation
            const prevDate = new Date(targetDate);
            prevDate.setDate(prevDate.getDate() - 1);
            const prevDateStr = prevDate.getFullYear() + '-' + 
                String(prevDate.getMonth() + 1).padStart(2, '0') + '-' + 
                String(prevDate.getDate()).padStart(2, '0');
            const prevRecord = cakeHistory.find(r => r.date === prevDateStr);

            let totalBatchesGlobal = 0;
            let totalCakesGlobal = 0;
            let html = '';
            
            // 計算本週趨勢係數 (Monday to Target-1)
            const weekTrendMultiplier = getWeeklyTrendFactor(dateStr);

            activeFlavors.forEach(flavor => {
                const baseAvg = getFlavorAverage(targetWeekday, flavor, dateStr);
                
                // 平常日平均需求度 -> 套用假日倍率 -> 套用新人係數 -> 套用本週趨勢係數
                const adjustedDemand = baseAvg * holidayMultiplier * joinerMultiplier * weekTrendMultiplier;
                
                // 前日打烊剩餘 (carryover) 可延續使用，減少當日所需生產量
                let carryover = 0;
                if (prevRecord && prevRecord.flavors && prevRecord.flavors[flavor]) {
                    carryover = prevRecord.flavors[flavor].remClose || 0;
                }
                const netDemand = Math.max(0, adjustedDemand - carryover);
                
                const bSize = getBatchSize(flavor);
                
                // 30% Ceiling Threshold Logic
                const remainder = netDemand % bSize;
                let batchesForFlavor = Math.floor(netDemand / bSize);
                
                if (remainder > (bSize * 0.3)) {
                    batchesForFlavor += 1;
                }
                
                // 需求不為0時最少保底1批
                if (batchesForFlavor === 0 && netDemand > 0) {
                    batchesForFlavor = 1;
                }
                
                const cakesProduced = batchesForFlavor * bSize;

                totalBatchesGlobal += batchesForFlavor;
                totalCakesGlobal += cakesProduced;

                const stats = getFlavorStats(targetWeekday, flavor);
                const wastePercent = Math.round(stats.wasteRate * 100);
                let wasteBadgeColor, wasteBadgeBg, wasteLabel;
                if (wastePercent <= 5) {
                    wasteBadgeColor = '#2ed573'; wasteBadgeBg = 'rgba(46,213,115,0.15)'; wasteLabel = `${wastePercent}% 耗損 (低)`;
                } else if (wastePercent <= 12) {
                    wasteBadgeColor = '#feca57'; wasteBadgeBg = 'rgba(254,202,87,0.15)'; wasteLabel = `${wastePercent}% 耗損 (中)`;
                } else {
                    wasteBadgeColor = '#ff6b6b'; wasteBadgeBg = 'rgba(255,107,107,0.15)'; wasteLabel = `${wastePercent}% 耗損 (高)`;
                }

                // Range bar: position low/high relative to [0, high*1.1]
                const rangeMax = stats.high > 0 ? stats.high * 1.1 : 1;
                const lowPct = Math.round((stats.low / rangeMax) * 100);
                const highPct = 100;
                const medPct = Math.round((stats.median / rangeMax) * 100);
                const targetPct = Math.min(100, Math.round((Math.round(adjustedDemand) / rangeMax) * 100));

                let calcDetails = `<div style="font-size:12px; color:var(--text-muted); margin-top:10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border-left: 3px solid rgba(255,255,255,0.15);">`;

                if (stats.count > 0) {
                    calcDetails += `<div style="margin-bottom:8px; font-size:11px; color:rgba(255,255,255,0.4);">📅 基於 ${stats.count} 筆同星期紀錄 / Based on ${stats.count} same-weekday records</div>`;
                    calcDetails += `<div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">`;
                    calcDetails += `<span style="font-size:11px; min-width:28px; color:#2ed573;">${stats.low}</span>`;
                    calcDetails += `<div style="flex:1; position:relative; height:8px; border-radius:99px; background:rgba(255,255,255,0.1);">`;
                    calcDetails += `<div style="position:absolute; left:${lowPct}%; width:${highPct - lowPct}%; height:100%; border-radius:99px; background:rgba(255,255,255,0.15);"></div>`;
                    calcDetails += `<div style="position:absolute; left:${medPct - 2}%; width:4px; height:100%; border-radius:99px; background:#feca57;" title="Median"></div>`;
                    calcDetails += `<div style="position:absolute; left:${targetPct - 1}%; width:3px; height:140%; top:-20%; border-radius:99px; background:#ff6b6b;" title="Target"></div>`;
                    calcDetails += `</div>`;
                    calcDetails += `<span style="font-size:11px; min-width:28px; text-align:right; color:#ff6b6b;">${stats.high}</span>`;
                    calcDetails += `</div>`;
                    calcDetails += `<div style="font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:8px;">低 Low: ${stats.low} · 中位 Median: ${stats.median} · 高 High: ${stats.high}</div>`;
                }

                calcDetails += `📊 歷史加權基準 Base avg: <b>${baseAvg.toFixed(0)}</b> 顆`;
                let factors = [];
                if (holidayMultiplier !== 1.0) factors.push(`節日 (${holidayMultiplier}x)`);
                if (joinerMultiplier !== 1.0) factors.push(`新人 (${joinerMultiplier.toFixed(2)}x)`);
                if (weekTrendMultiplier !== 1.0) factors.push(`本週趨勢 (${weekTrendMultiplier.toFixed(2)}x)`);
                if (factors.length > 0) calcDetails += ` × ${factors.join(' × ')}`;
                calcDetails += ` = <b style="color:var(--primary);">${Math.round(adjustedDemand)}</b> 顆`;
                if (carryover > 0) calcDetails += `<br>扣除前日剩餘 Carryover: <b>-${carryover}</b> → 淨需求 Net: <b style="color:var(--primary);">${Math.round(netDemand)}</b> 顆`;
                calcDetails += `</div>`;

                html += `
                    <div class="plan-item" style="flex-direction:column; padding-bottom: 15px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:6px;">
                            <span style="font-size:17px;">${FLAVOR_NAMES[flavor]}</span>
                            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                <span style="font-size:11px; padding:3px 10px; border-radius:99px; background:${wasteBadgeBg}; color:${wasteBadgeColor}; border:1px solid ${wasteBadgeColor}40;">${wasteLabel}</span>
                                <span style="color:var(--secondary); font-weight:bold; font-size:17px;">${batchesForFlavor} 批 (${cakesProduced} 顆)</span>
                            </div>
                        </div>
                        ${calcDetails}
                    </div>
                `;
            });

            // 顯示本週趨勢套用資訊
            let trendMsg = '';
            if (targetWeekday !== 1) {
                const trendPct = Math.round((weekTrendMultiplier - 1) * 100);
                const trendColor = trendPct > 0 ? 'var(--success)' : (trendPct < 0 ? '#ff4757' : 'var(--text-muted)');
                const trendSign = trendPct > 0 ? '+' : '';
                trendMsg = `<div style="text-align:center; font-size:13px; margin-bottom:10px; color:${trendColor};">
                    📈 本週趨勢調整: ${trendSign}${trendPct}% (Multiplier: ${weekTrendMultiplier.toFixed(2)})
                </div>`;
            }

            document.getElementById('plan-list').innerHTML = trendMsg + html;
            document.getElementById('plan-total').innerText = `總計: ${totalBatchesGlobal} 批 (${totalCakesGlobal} 顆)`;
            document.getElementById('plan-result').classList.add('active');
        }

        initRecordTab();
        initPlanTab();

        // ========================
        // Charts Logic (Trends Tab)
        // ========================
        let demandChartInstance = null;
        let wasteChartInstance = null;

        function renderCharts() {
            // Sort ascending by date to show timeline left-to-right
            let data = [...cakeHistory].sort((a,b) => new Date(a.date) - new Date(b.date));
            // Get the last 14 days of recorded data
            data = data.slice(-14);

            if (data.length === 0) return; // No data yet

            const labels = data.map(d => {
                const p = d.date.split('-');
                return `${p[1]}/${p[2]}`; // MM/DD format
            });

            // Calculate daily demand per flavor
            const originalDemand = data.map(d => d.flavors['original'] ? Math.round(estimateDemand(d.flavors['original'].created, d.flavors['original'].remClose, d.flavors['original'].soldOutTime, d.joiners > 0)) : 0);
            const seasonalDemand = data.map(d => d.flavors['seasonal'] ? Math.round(estimateDemand(d.flavors['seasonal'].created, d.flavors['seasonal'].remClose, d.flavors['seasonal'].soldOutTime, d.joiners > 0)) : 0);
            const matchaDemand = data.map(d => d.flavors['matcha'] ? Math.round(estimateDemand(d.flavors['matcha'].created, d.flavors['matcha'].remClose, d.flavors['matcha'].soldOutTime, d.joiners > 0)) : 0);
            const chocolateDemand = data.map(d => d.flavors['chocolate'] ? Math.round(estimateDemand(d.flavors['chocolate'].created, d.flavors['chocolate'].remClose, d.flavors['chocolate'].soldOutTime, d.joiners > 0)) : 0);

            // Calculate daily waste (remClose) per flavor
            const originalWaste = data.map(d => d.flavors['original']?.remClose || 0);
            const seasonalWaste = data.map(d => d.flavors['seasonal']?.remClose || 0);
            const matchaWaste = data.map(d => d.flavors['matcha']?.remClose || 0);
            const chocolateWaste = data.map(d => d.flavors['chocolate']?.remClose || 0);

            // Colors for flavors
            const colors = {
                original: { border: '#feca57', bg: 'rgba(254, 202, 87, 0.2)', solid: '#feca57' },
                seasonal: { border: '#ff6b6b', bg: 'rgba(255, 107, 107, 0.2)', solid: '#ff6b6b' },
                matcha: { border: '#1dd1a1', bg: 'rgba(29, 209, 161, 0.2)', solid: '#1dd1a1' },
                chocolate: { border: '#576574', bg: 'rgba(87, 101, 116, 0.2)', solid: '#576574' }
            };

            // Draw Demand Chart (Line)
            const ctxDemand = document.getElementById('demandChart').getContext('2d');
            if (demandChartInstance) demandChartInstance.destroy();
            demandChartInstance = new Chart(ctxDemand, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '原味', data: originalDemand, borderColor: colors.original.border, backgroundColor: colors.original.bg, fill: false, tension: 0.3, pointBackgroundColor: colors.original.solid, pointRadius: 3 },
                        { label: '時令', data: seasonalDemand, borderColor: colors.seasonal.border, backgroundColor: colors.seasonal.bg, fill: false, tension: 0.3, pointBackgroundColor: colors.seasonal.solid, pointRadius: 3 },
                        { label: '抹茶', data: matchaDemand, borderColor: colors.matcha.border, backgroundColor: colors.matcha.bg, fill: false, tension: 0.3, pointBackgroundColor: colors.matcha.solid, pointRadius: 3 },
                        { label: '巧克力', data: chocolateDemand, borderColor: colors.chocolate.border, backgroundColor: colors.chocolate.bg, fill: false, tension: 0.3, pointBackgroundColor: colors.chocolate.solid, pointRadius: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#f5f6fa' } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { ticks: { color: '#dcdde1' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        y: { ticks: { color: '#dcdde1' }, grid: { color: 'rgba(255,255,255,0.1)' }, beginAtZero: true }
                    }
                }
            });

            // Draw Waste Chart (Stacked Bar)
            const ctxWaste = document.getElementById('wasteChart').getContext('2d');
            if (wasteChartInstance) wasteChartInstance.destroy();
            wasteChartInstance = new Chart(ctxWaste, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '原味', data: originalWaste, backgroundColor: colors.original.solid, borderRadius: 2 },
                        { label: '時令', data: seasonalWaste, backgroundColor: colors.seasonal.solid, borderRadius: 2 },
                        { label: '抹茶', data: matchaWaste, backgroundColor: colors.matcha.solid, borderRadius: 2 },
                        { label: '巧克力', data: chocolateWaste, backgroundColor: colors.chocolate.solid, borderRadius: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#f5f6fa' } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { stacked: true, ticks: { color: '#dcdde1' }, grid: { display: false } },
                        y: { stacked: true, ticks: { color: '#dcdde1' }, grid: { color: 'rgba(255,255,255,0.1)' }, beginAtZero: true }
                    }
                }
            });
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker 註冊成功!', reg))
                    .catch(err => console.log('Service Worker 註冊失敗:', err));
            });
        }

        // ========================
        // Camera Preview & AI Auto-Import Logic
        // ========================
        let currentBase64Image = null;
        let currentMimeType = null;

        document.getElementById('camera-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                currentMimeType = file.type;
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentBase64Image = event.target.result.split(',')[1]; // get raw base64
                    document.getElementById('preview-img').src = event.target.result;
                    document.getElementById('preview-container').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        function clearPreview() {
            document.getElementById('camera-input').value = '';
            document.getElementById('preview-container').style.display = 'none';
            document.getElementById('preview-img').src = '';
            currentBase64Image = null;
            currentMimeType = null;
        }

        async function autoImportImage() {
            if (!currentBase64Image) {
                alert("請先拍照或上傳報表照片！\nPlease take or upload a photo first.");
                return;
            }

            const dateStr = document.getElementById('record-date').value;
            if (!dateStr) return alert("請先選擇紀錄日期！\nPlease select a date first.");

            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dateQuery = `${days[d.getDay()]} ${d.getDate()}`;

            document.getElementById('btn-auto-import').disabled = true;
            document.getElementById('ai-loading').style.display = 'block';

            const prompt = `You are a data extraction assistant for a bakery. The user has uploaded a photo of a handwritten daily cake tracking chart.
Look for the row corresponding EXACTLY to the date label: "${dateQuery}". (e.g. "Wed 15", "Mon 13", etc.)

The columns in the table are:
1. Date (e.g. Wed 1)
2. Sellable Total (this represents the 'created' amount)
3. Failed (ignore this column)
4. Cake Amount at 5pm (this represents 'rem5pm')
5. Unsold/Sold Out Time (this contains 'remClose' if it's a number like 3 or 14, OR 'soldOutTime' if it's a time like 5:05 or 8:20. Sometimes it has both like "11 + 10 expired" -> remClose is 11. If it says "AH", ignore it).

The flavors are identified by these letters inside each cell:
- O = original (原味)
- CP = seasonal (時令)
- M = matcha (抹茶)
- C = chocolate (巧克力)

Extract the data ONLY for the row labeled "${dateQuery}".
If a flavor is not present in that row, return 0 for numbers and empty string for soldOutTime.
For the "Unsold" column: if a time is written, put it in 'soldOutTime' and leave 'remClose' as 0 (unless a specific unsold number is also clearly stated).

Return ONLY a valid JSON object with no markdown, no backticks, no explanation — just raw JSON:
{
  "original": { "created": 0, "rem5pm": 0, "remClose": 0, "soldOutTime": "" },
  "seasonal": { "created": 0, "rem5pm": 0, "remClose": 0, "soldOutTime": "" },
  "matcha": { "created": 0, "rem5pm": 0, "remClose": 0, "soldOutTime": "" },
  "chocolate": { "created": 0, "rem5pm": 0, "remClose": 0, "soldOutTime": "" }
}`;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: currentMimeType,
                                        data: currentBase64Image
                                    }
                                },
                                { type: 'text', text: prompt }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗 / API request failed: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const textRes = data.content.find(b => b.type === 'text')?.text || '';
                const clean = textRes.replace(/```json|```/g, '').trim();

                let parsed;
                try {
                    parsed = JSON.parse(clean);
                } catch(e) {
                    throw new Error("AI 回傳格式錯誤 / AI returned invalid JSON: " + textRes);
                }

                const flavors = ['original', 'seasonal', 'matcha', 'chocolate'];
                flavors.forEach(flavor => {
                    const block = parsed[flavor];
                    if (!block) return;
                    const createdInput = document.getElementById(`${flavor}-created`);
                    const rem5pmInput = document.getElementById(`${flavor}-rem5`);
                    const remCloseInput = document.getElementById(`${flavor}-remClose`);
                    const soldOutInput = document.getElementById(`${flavor}-soldOut`);
                    if (createdInput && block.created !== undefined) createdInput.value = block.created;
                    if (rem5pmInput && block.rem5pm !== undefined) rem5pmInput.value = block.rem5pm;
                    if (remCloseInput && block.remClose !== undefined) remCloseInput.value = block.remClose;
                    if (soldOutInput && block.soldOutTime) {
                        let timeStr = block.soldOutTime.replace(/[^0-9:]/g, '');
                        if (timeStr.includes(':')) {
                            const p = timeStr.split(':');
                            if (p[0].length === 1) p[0] = '0' + p[0];
                            if (p[1].length === 1) p[1] = '0' + p[1];
                            soldOutInput.value = `${p[0]}:${p[1]}`;
                        } else {
                            soldOutInput.value = block.soldOutTime;
                        }
                    } else if (soldOutInput) {
                        soldOutInput.value = '';
                    }
                });

                alert("✨ Claude AI 解析完成！請核對畫面數字是否與照片相符。\nDone! Please verify the numbers match the photo.");

            } catch (err) {
                console.error(err);
                alert("解析失敗 / Parse failed: " + err.message);
            } finally {
                document.getElementById('btn-auto-import').disabled = false;
                document.getElementById('ai-loading').style.display = 'none';
            }
        }

    </script>
</body>
</html>
